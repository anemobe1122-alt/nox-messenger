name: Build Nox for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save electron electron-builder
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
      - name: Build EXE and publish release when triggered by a version tag
        run: npx electron-builder --win nsis portable --x64 --publish ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nox-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
