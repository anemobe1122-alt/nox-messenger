appId: com.nox.messenger
productName: Nox
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: anemobe1122-alt
  repo: nox-messenger
